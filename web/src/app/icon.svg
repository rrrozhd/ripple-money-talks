<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ripple mark: a price "drop" with two rings, on a paper tile so it reads on light and dark tabs -->
  <rect width="32" height="32" rx="8" fill="#f6f4ef"/>
  <circle cx="16" cy="16" r="3.4" fill="#0e6b55"/>
  <circle cx="16" cy="16" r="7.8" fill="none" stroke="#0e6b55" stroke-width="2" opacity="0.7"/>
  <circle cx="16" cy="16" r="12.2" fill="none" stroke="#0e6b55" stroke-width="1.6" opacity="0.35"/>
</svg>
