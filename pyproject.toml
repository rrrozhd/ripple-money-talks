[project]
name = "ripple"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rrrozhd", email = "rrrozhd@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deepagents>=0.7.28",
    "duckdb>=1.5.6",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "prismtrace-sdk>=0.5.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
ripple = "ripple:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
